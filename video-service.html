<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文稿影片產生器 — 線上出片</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #f6f2ea; color: #2b2118; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { line-height: 1.8; color: #5a4a38; }
  .spin { width: 36px; height: 36px; margin: 24px auto; border: 4px solid #e5dccb; border-top-color: #8a6d3b; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; margin-top: 14px; padding: 12px 22px; background: #8a6d3b; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; }
  a.btn2 { display: inline-block; margin-top: 14px; padding: 12px 22px; background: #5b7a4e; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; border: none; font-size: 16px; cursor: pointer; }
  .note { font-size: 13px; color: #9a8a74; margin-top: 28px; }
  #offline { display: none; }
  #going { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 文稿影片產生器</h1>
  <div id="going">
    <div class="spin"></div>
    <p>正在前往出片服務…</p>
    <p><a class="btn" href="https://scriptstudio-video.loca.lt">如果沒有自動跳轉，請按這裡</a></p>
  </div>
  <div id="offline">
    <p style="font-size:18px">😴 服務暫時離線，請稍後再試。</p>
    <p>出片服務正在重啟或網路暫時不通，通常幾分鐘內會自動恢復。<br>這個頁面會自動重試，不用重新找連結。</p>
    <p><button class="btn2" onclick="location.reload()">再試一次</button></p>
    <p><a class="btn" href="https://scriptstudio-video.loca.lt">直接開啟服務（可能仍在離線）</a></p>
  </div>
  <p class="note">這是永久連結：出片服務的位址變更時，這個頁面會自動更新。<br>更新時間：2026-11-06 12:58:24 UTC</p>
</div>
<script>
(function () {
  var TARGET = "https://scriptstudio-video.loca.lt";
  var LAST = "https://scriptstudio-video.loca.lt";
  var going = document.getElementById('going');
  var off = document.getElementById('offline');
  function showOffline() {
    going.style.display = 'none';
    off.style.display = 'block';
  }
  function probe(url, ms) {
    var ctrl = new AbortController();
    var to = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url + '/api/jobs', { signal: ctrl.signal })
      .then(function (r) { clearTimeout(to); return r.ok; })
      .catch(function () { clearTimeout(to); return false; });
  }
  if (TARGET) {
    probe(TARGET, 8000).then(function (ok) {
      if (ok) location.replace(TARGET);
      else showOffline();
    });
  } else if (LAST) {
    // 離線版：每 30 秒探一次上次的位址，通了就跳過去
    (function retry() {
      probe(LAST, 8000).then(function (ok) {
        if (ok) location.replace(LAST);
        else setTimeout(retry, 30000);
      });
    })();
  }
})();
</script>
</body>
</html>
